<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1700" viewBox="0 0 1000 1700">
  <defs>
    <style>
      .bg { fill: #faf9f6; }
      .titleBand { fill: #e2ecf6; stroke: #2d2d2d; stroke-width: 2; }
      .card { fill: #f2f2f2; stroke: #2d2d2d; stroke-width: 2; rx: 12; ry: 12; }
      .line { stroke: #2d2d2d; stroke-width: 2.5; marker-end: url(#arrow); }
      .title { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 34px; font-weight: 700; fill: #191919; }
      .stepTitle { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 28px; font-weight: 700; fill: #191919; }
      .desc { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-size: 21px; fill: #444; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2d2d2d" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="1700"/>

  <rect class="titleBand" x="50" y="30" width="900" height="70" rx="10" ry="10"/>
  <text class="title" x="80" y="77">Gatling 壓測流程（中文詳細版）</text>

  <!-- Cards -->
  <g id="cards">
    <rect class="card" x="120" y="140" width="760" height="120"/>
    <text class="stepTitle" x="150" y="184">1. 執行命令</text>
    <text class="desc" x="150" y="220">`mvnw gatling:test`，指定 Simulation 類別開始壓測流程。</text>

    <rect class="card" x="120" y="292" width="760" height="120"/>
    <text class="stepTitle" x="150" y="336">2. Maven 建置</text>
    <text class="desc" x="150" y="372">先 test-compile，再交由 gatling-maven-plugin 啟動腳本。</text>

    <rect class="card" x="120" y="444" width="760" height="120"/>
    <text class="stepTitle" x="150" y="488">3. 載入測試資源</text>
    <text class="desc" x="150" y="524">讀取 `data/users.csv` 作 feeder；`login.json` 可作 POST/PUT 範本。</text>

    <rect class="card" x="120" y="596" width="760" height="120"/>
    <text class="stepTitle" x="150" y="640">4. HTTP 協定設定</text>
    <text class="desc" x="150" y="676">設定 `baseUrl`、`accept` header 與資源載入過濾規則。</text>

    <rect class="card" x="120" y="748" width="760" height="120"/>
    <text class="stepTitle" x="150" y="792">5. 定義 Scenario</text>
    <text class="desc" x="150" y="828">`feed -> GET /delay/1 -> check 200 -> pause 1s`。</text>

    <rect class="card" x="120" y="900" width="760" height="120"/>
    <text class="stepTitle" x="150" y="944">6. 注入虛擬使用者</text>
    <text class="desc" x="150" y="980">`rampUsers(10).during(10s)`，10 秒內線性拉升到 10 位使用者。</text>

    <rect class="card" x="120" y="1052" width="760" height="120"/>
    <text class="stepTitle" x="150" y="1096">7. 執行測試與收集指標</text>
    <text class="desc" x="150" y="1132">產生請求並統計延遲、吞吐、成功/失敗（OK/KO）。</text>

    <rect class="card" x="120" y="1204" width="760" height="120"/>
    <text class="stepTitle" x="150" y="1248">8. 記錄明細</text>
    <text class="desc" x="150" y="1284">依 `logback.xml` 輸出完整 URL 到 `target/requests.txt`。</text>

    <rect class="card" x="120" y="1356" width="760" height="120"/>
    <text class="stepTitle" x="150" y="1400">9. 產生報告與摘要</text>
    <text class="desc" x="150" y="1436">報告在 `target/gatling/<run>/index.html`；摘要輸出 `target/summary.txt`。</text>
  </g>

  <!-- Arrows -->
  <line class="line" x1="500" y1="260" x2="500" y2="292"/>
  <line class="line" x1="500" y1="412" x2="500" y2="444"/>
  <line class="line" x1="500" y1="564" x2="500" y2="596"/>
  <line class="line" x1="500" y1="716" x2="500" y2="748"/>
  <line class="line" x1="500" y1="868" x2="500" y2="900"/>
  <line class="line" x1="500" y1="1020" x2="500" y2="1052"/>
  <line class="line" x1="500" y1="1172" x2="500" y2="1204"/>
  <line class="line" x1="500" y1="1324" x2="500" y2="1356"/>
</svg>
