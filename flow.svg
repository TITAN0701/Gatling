<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2b2b2b" />
    </marker>
    <style>
      .box { fill: #f2f2f2; stroke: #2b2b2b; stroke-width: 2; rx: 12; ry: 12; }
      .text { font-family: 'Segoe UI', 'Arial', sans-serif; font-size: 18px; fill: #1a1a1a; }
      .arrow { stroke: #2b2b2b; stroke-width: 2.5; marker-end: url(#arrow); }
      .sub { font-size: 14px; fill: #4d4d4d; }
    </style>
  </defs>

  <!-- Boxes -->
  <rect class="box" x="40"  y="120" width="200" height="120" />
  <rect class="box" x="270" y="120" width="200" height="120" />
  <rect class="box" x="500" y="90"  width="200" height="180" />
  <rect class="box" x="730" y="120" width="200" height="120" />
  <rect class="box" x="960" y="120" width="200" height="120" />

  <!-- Text -->
  <text class="text" x="140" y="175" text-anchor="middle">Run</text>
  <text class="sub"  x="140" y="200" text-anchor="middle">mvnw gatling:test</text>

  <text class="text" x="370" y="175" text-anchor="middle">Build</text>
  <text class="sub"  x="370" y="200" text-anchor="middle">Compile + Plugin</text>

  <text class="text" x="600" y="155" text-anchor="middle">Simulation</text>
  <text class="sub"  x="600" y="180" text-anchor="middle">HTTP + Feeder</text>
  <text class="sub"  x="600" y="205" text-anchor="middle">Scenario + Inject</text>

  <text class="text" x="830" y="175" text-anchor="middle">Run Test</text>
  <text class="sub"  x="830" y="200" text-anchor="middle">Requests + Logs</text>

  <text class="text" x="1060" y="175" text-anchor="middle">Report</text>
  <text class="sub"  x="1060" y="200" text-anchor="middle">index.html + summary</text>

  <!-- Arrows -->
  <line class="arrow" x1="240" y1="180" x2="270" y2="180" />
  <line class="arrow" x1="470" y1="180" x2="500" y2="180" />
  <line class="arrow" x1="700" y1="180" x2="730" y2="180" />
  <line class="arrow" x1="930" y1="180" x2="960" y2="180" />
</svg>
